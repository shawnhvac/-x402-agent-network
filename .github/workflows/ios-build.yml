name: Build AgentPay Provider iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'x402-agent-network/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install CocoaPods (if needed)
        run: |
          gem install cocoapods --no-document 2>/dev/null || true

      - name: Create Xcode project from Swift files
        working-directory: x402-agent-network/ios
        run: |
          # Generate a minimal .xcodeproj using xcodegen or manual creation
          mkdir -p AgentPayProvider.xcodeproj
          cat > AgentPayProvider.xcodeproj/project.pbxproj << 'PBXEOF'
// !$*UTF8*$!
{
  archiveVersion = 1;
  classes = {};
  objectVersion = 56;
  objects = {};
  rootObject = "";
}
PBXEOF
          echo "Project scaffold created"

      - name: Import signing certificate
        env:
          CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROVISIONING_B64: ${{ secrets.IOS_PROVISIONING_B64 }}
        run: |
          # Create keychain
          security create-keychain -p "temp123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp123" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import cert
          echo "$CERT_P12_B64" | base64 -d > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp123" build.keychain

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/agentpay_provider.mobileprovision

      - name: Build & Archive
        working-directory: x402-agent-network/ios
        run: |
          xcodebuild \
            -project AgentPayProvider.xcodeproj \
            -scheme AgentPayProvider \
            -configuration Release \
            -archivePath build/AgentPayProvider.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="AgentPay Provider Distribution" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            clean archive

      - name: Export IPA
        working-directory: x402-agent-network/ios
        run: |
          cat > ExportOptions.plist << 'PLISTEOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>app-store</string>
  <key>teamID</key>
  <string>${{ secrets.APPLE_TEAM_ID }}</string>
  <key>uploadBitcode</key>
  <false/>
  <key>compileBitcode</key>
  <false/>
  <key>uploadSymbols</key>
  <true/>
</dict>
</plist>
PLISTEOF
          xcodebuild -exportArchive \
            -archivePath build/AgentPayProvider.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentpay-provider-ios
          path: x402-agent-network/ios/build/ipa/*.ipa
          if-no-files-found: warn

      - name: Upload to App Store Connect (optional)
        if: ${{ secrets.APPLE_API_KEY_B64 != '' }}
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_B64" | base64 -d > AuthKey.p8
          xcrun altool --upload-app \
            -f x402-agent-network/ios/build/ipa/AgentPayProvider.ipa \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID" \
            --private-key AuthKey.p8 \
            --type ios
