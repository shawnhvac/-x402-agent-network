name: Build AgentPay Provider iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'x402-agent-network/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications/ | grep Xcode

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications/ | grep "^Xcode" | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s /Applications/$XCODE/Contents/Developer
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Write xcodegen project spec
        working-directory: x402-agent-network/ios
        run: |
          cat > project.yml << EOF
          name: AgentPayProvider
          options:
            bundleIdPrefix: com.agentpay
            deploymentTarget:
              iOS: "16.0"
          settings:
            PRODUCT_BUNDLE_IDENTIFIER: com.agentpay.provider
            SWIFT_VERSION: "5.9"
            MARKETING_VERSION: "2.0.0"
            CURRENT_PROJECT_VERSION: "1"
          targets:
            AgentPayProvider:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - AgentPayProvider
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.agentpay.provider
                INFOPLIST_FILE: AgentPayProvider/Info.plist
              entitlements:
                com.apple.developer.siri: true
          EOF

      - name: Write Info.plist
        working-directory: x402-agent-network/ios/AgentPayProvider
        run: |
          cat > Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>AgentPay Provider</string>
            <key>CFBundleIdentifier</key>
            <string>com.agentpay.provider</string>
            <key>CFBundleName</key>
            <string>AgentPayProvider</string>
            <key>CFBundleShortVersionString</key>
            <string>2.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>NSSiriUsageDescription</key>
            <string>AgentPay uses Siri to let you check bookings, accept appointments, and view earnings with your voice.</string>
          </dict>
          </plist>
          EOF

      - name: Generate Xcode project
        working-directory: x402-agent-network/ios
        run: xcodegen generate

      - name: Import signing certificate
        env:
          CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROVISIONING_B64: ${{ secrets.IOS_PROVISIONING_B64 }}
        run: |
          security create-keychain -p "temp123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp123" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$CERT_P12_B64" | base64 -d > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp123" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/agentpay_provider.mobileprovision

      - name: Build and Archive
        working-directory: x402-agent-network/ios
        run: |
          xcodebuild \
            -project AgentPayProvider.xcodeproj \
            -scheme AgentPayProvider \
            -configuration Release \
            -archivePath build/AgentPayProvider.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="AgentPay Provider Distribution" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            clean archive

      - name: Export IPA
        working-directory: x402-agent-network/ios
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/AgentPayProvider.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentpay-provider-ios
          path: x402-agent-network/ios/build/ipa/*.ipa
          if-no-files-found: warn

      - name: Upload to App Store Connect
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -n "$APPLE_API_KEY_B64" ]; then
            echo "$APPLE_API_KEY_B64" | base64 -d > AuthKey.p8
            xcrun altool --upload-app \
              -f x402-agent-network/ios/build/ipa/AgentPayProvider.ipa \
              --apiKey "$APPLE_API_KEY_ID" \
              --apiIssuer "$APPLE_API_ISSUER_ID" \
              --private-key AuthKey.p8 \
              --type ios
          else
            echo "No Apple API key — skipping App Store upload"
          fi
