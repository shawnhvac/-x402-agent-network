name: Build AgentPay Provider APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          echo "/tmp/gradle-dist/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Provider APK
        working-directory: x402-agent-network/android
        run: gradle assembleDebug -x lint --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Find and copy APK
        run: |
          APK=$(find x402-agent-network/android -name "*.apk" | head -1)
          echo "Found APK: $APK"
          cp "$APK" agentpay-provider.apk
          ls -lh agentpay-provider.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentpay-provider-apk
          path: agentpay-provider.apk
          retention-days: 30

      - name: Build complete
        run: echo "SUCCESS — agentpay-provider.apk is ready"
