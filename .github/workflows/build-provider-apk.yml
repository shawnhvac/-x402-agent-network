name: Build AgentPay Provider APK + AAB

on:
  push:
    branches: [ main ]
    paths:
      - 'x402-agent-network/android/**'
      - '.github/workflows/build-provider-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          sudo mv gradle-8.2 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > x402-agent-network/android/app/agentpay-release.keystore
          echo "Keystore decoded: $(ls -lh x402-agent-network/android/app/agentpay-release.keystore)"

      - name: Configure signing in gradle.properties
        run: |
          cat >> x402-agent-network/android/gradle.properties << EOF
          RELEASE_STORE_FILE=agentpay-release.keystore
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Update app/build.gradle.kts for release signing
        run: |
          # Inject signingConfigs into build.gradle.kts if not present
          if ! grep -q "signingConfigs" x402-agent-network/android/app/build.gradle.kts; then
            sed -i '/^android {/a\    signingConfigs {
        create("release") {
            storeFile = file(project.findProperty("RELEASE_STORE_FILE") as String)
            storePassword = project.findProperty("RELEASE_STORE_PASSWORD") as String
            keyAlias = project.findProperty("RELEASE_KEY_ALIAS") as String
            keyPassword = project.findProperty("RELEASE_KEY_PASSWORD") as String
        }
    }' x402-agent-network/android/app/build.gradle.kts
            # Set release build type to use release signing
            sed -i '/buildTypes {/,/^    }/{ /release {/a\            signingConfig = signingConfigs.getByName("release") }' x402-agent-network/android/app/build.gradle.kts || true
          fi

      - name: Build release APK
        working-directory: x402-agent-network/android
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build release AAB (Play Store)
        working-directory: x402-agent-network/android
        run: gradle bundleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Collect and rename artifacts
        run: |
          VERSION=$(grep versionName x402-agent-network/android/app/build.gradle.kts | head -1 | grep -o '"[^"]*"' | tr -d '"')
          BUILD=${{ github.run_number }}
          
          # Find APK
          APK=$(find x402-agent-network/android -name "*release*.apk" | grep -v unsigned | head -1)
          if [ -z "$APK" ]; then
            APK=$(find x402-agent-network/android -name "*.apk" | grep -v test | head -1)
          fi
          cp "$APK" "agentpay-provider-v${VERSION}-build${BUILD}.apk"
          cp "$APK" "agentpay-provider.apk"
          
          # Find AAB
          AAB=$(find x402-agent-network/android -name "*release*.aab" | head -1)
          if [ -n "$AAB" ]; then
            cp "$AAB" "agentpay-provider-v${VERSION}-build${BUILD}.aab"
            cp "$AAB" "agentpay-provider.aab"
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          ls -lh agentpay-provider*

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentpay-provider-apk
          path: agentpay-provider*.apk

      - name: Upload AAB artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: agentpay-provider-aab
          path: agentpay-provider*.aab
          if-no-files-found: warn

      - name: Build complete
        run: echo "✅ APK + AAB built and signed with release keystore — v${{ env.VERSION }} build ${{ env.BUILD }}"
