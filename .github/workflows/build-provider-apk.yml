name: Build AgentPay Provider APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install build tools
        run: sdkmanager "build-tools;34.0.0" || true

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          echo "Debug keystore ready"

      - name: Build Provider APK
        working-directory: android
        run: ./gradlew assembleDebug -x lint --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Find and version APK
        run: |
          APK=$(find android -name "*.apk" | grep -v "test" | head -1)
          echo "Found APK: $APK"
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          ls -lh "$APK"

      - name: Sign APK with apksigner
        run: |
          BUILD_TOOLS=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -1)
          APKSIGNER="/usr/local/lib/android/sdk/build-tools/${BUILD_TOOLS}/apksigner"
          VERSION=$(grep versionName android/build.gradle.kts | head -1 | grep -o '"[^"]*"' | tr -d '"')
          OUT_APK="agentpay-provider-v${VERSION}.apk"
          $APKSIGNER sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$OUT_APK" \
            "$APK_PATH"
          cp "$OUT_APK" agentpay-provider.apk
          echo "VERSIONED_APK=$OUT_APK" >> $GITHUB_ENV
          echo "Signed: $OUT_APK"
          ls -lh "$OUT_APK" agentpay-provider.apk
          $APKSIGNER verify --verbose agentpay-provider.apk | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentpay-provider-apk
          path: |
            agentpay-provider.apk
            agentpay-provider-v*.apk
          retention-days: 30

      - name: Build complete
        run: echo "SUCCESS - agentpay-provider.apk built and signed"

