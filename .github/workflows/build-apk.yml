name: AgentPay APK Build

on:
  push:
    branches: [ master ]
    paths:
      - 'android/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Cache Gradle ───────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 4. Put google-services.json from secret ───────────────────────────────
      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/google-services.json

      # ── 5. Make gradlew executable ───────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── 6. Build debug APK (always) ──────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ── 7. Upload debug APK as artifact ──────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agentpay-debug-${{ github.sha }}
          path: android/build/outputs/apk/debug/android-debug.apk
          retention-days: 30

      # ── 8. Build release APK (only if keystore secret exists) ────────────────
      - name: Build Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64:      ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD:    ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:            ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:         ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > agentpay.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/agentpay.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      # ── 9. Upload release APK ────────────────────────────────────────────────
      - name: Upload Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: agentpay-release-${{ github.sha }}
          path: android/build/outputs/apk/release/android-release.apk
          retention-days: 90

      # ── 10. Create GitHub Release on version tags ─────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && secrets.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: android/build/outputs/apk/release/android-release.apk
          name: AgentPay ${{ github.ref_name }}
          body: |
            ## AgentPay ${{ github.ref_name }}
            
            ### What's New
            - Dual-mode app: Customer & Provider onboarding
            - Firebase FCM push notifications
            - Escrow accept/deny from notification
            - Real-time earnings dashboard
            
            ### Install
            Download `agentpay-release.apk` below and install on Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
