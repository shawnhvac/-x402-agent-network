<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - AgentPay Contacts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-form {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .login-form h1 {
            color: #60a5fa;
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }
        .login-form button {
            width: 100%;
            padding: 12px;
            background: #60a5fa;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-form button:hover {
            background: #3b82f6;
        }
        .error {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .error.show {
            display: block;
        }
        .dashboard {
            display: none;
        }
        .dashboard.show {
            display: block;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .dashboard-header h1 {
            color: #60a5fa;
        }
        .logout-btn {
            background: #ef4444;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .logout-btn:hover {
            background: #dc2626;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .contacts-grid {
            display: grid;
            gap: 20px;
        }
        .contact-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            transition: border-color 0.3s;
        }
        .contact-card:hover {
            border-color: #3b82f6;
        }
        .contact-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        .contact-info h3 {
            color: #60a5fa;
            margin-bottom: 5px;
        }
        .contact-email {
            color: #94a3b8;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .contact-subject {
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 4px;
            color: #cbd5e1;
            font-weight: 500;
            margin-bottom: 10px;
            display: inline-block;
        }
        .contact-timestamp {
            color: #64748b;
            font-size: 0.85em;
        }
        .contact-message {
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            color: #e2e8f0;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 200px;
            overflow-y: auto;
        }
        .stats {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .stat-item h4 {
            color: #94a3b8;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .stat-item .number {
            color: #60a5fa;
            font-size: 2em;
            font-weight: 600;
        }
        .no-contacts {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div id="loginContainer" class="login-container">
        <div class="login-form">
            <h1>🔐 Admin Dashboard</h1>
            <div id="loginError" class="error"></div>
            <div class="form-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" placeholder="Enter admin password" required>
            </div>
            <button onclick="handleLogin()">Login</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard">
        <div class="dashboard-header">
            <h1>📧 Contact Form Submissions</h1>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="container">
            <div class="stats" id="stats"></div>
            <div class="contacts-grid" id="contactsGrid"></div>
        </div>
    </div>

    <script>
        // ✅ SECURITY: Backend-validated authentication
        // Password never stored in browser
        // Session managed via secure HttpOnly cookies
        
        async function handleLogin() {
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            if (!password) {
                errorDiv.textContent = '❌ Please enter a password';
                errorDiv.classList.add('show');
                return;
            }

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', // Send/receive cookies
                    body: JSON.stringify({ password })
                });

                if (response.ok) {
                    // Backend set secure HttpOnly cookie
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('dashboard').classList.add('show');
                    document.getElementById('password').value = '';
                    loadContacts();
                } else {
                    const data = await response.json();
                    errorDiv.textContent = '❌ ' + (data.error || 'Login failed');
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = '❌ Connection error. Please try again.';
                errorDiv.classList.add('show');
            }
        }

        async function handleLogout() {
            try {
                await fetch('/api/admin/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
            } catch (error) {
                console.error('Logout error:', error);
            }
            
            document.getElementById('password').value = '';
            document.getElementById('dashboard').classList.remove('show');
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('loginError').classList.remove('show');
        }

        async function loadContacts() {
            try {
                const response = await fetch('/api/admin/contacts', {
                    credentials: 'include' // Send HttpOnly cookie
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        handleLogout();
                        return;
                    }
                    throw new Error('Failed to load contacts');
                }

                const contacts = await response.json();
                renderContacts(contacts);
            } catch (error) {
                console.error('Error loading contacts:', error);
                document.getElementById('contactsGrid').innerHTML = 
                    '<div class="no-contacts">Error loading contacts. Please try again.</div>';
            }
        }

        function renderContacts(contacts) {
            const grid = document.getElementById('contactsGrid');
            const statsDiv = document.getElementById('stats');

            if (!contacts || contacts.length === 0) {
                grid.innerHTML = '<div class="no-contacts">No contact submissions yet</div>';
                statsDiv.innerHTML = '<div class="stat-item"><h4>Total Submissions</h4><div class="number">0</div></div>';
                return;
            }

            // Stats
            const uniqueEmails = new Set(contacts.map(c => c.email)).size;
            const lastSubmission = new Date(contacts[0].timestamp).toLocaleString();
            
            const statsHtml = `
                <div class="stat-item">
                    <h4>Total Submissions</h4>
                    <div class="number">${contacts.length}</div>
                </div>
                <div class="stat-item">
                    <h4>Unique Emails</h4>
                    <div class="number">${uniqueEmails}</div>
                </div>
                <div class="stat-item">
                    <h4>Last Submission</h4>
                    <div class="number" style="font-size: 0.9em; margin-top: 5px;">${lastSubmission}</div>
                </div>
            `;
            statsDiv.innerHTML = statsHtml;

            // Contacts
            grid.innerHTML = contacts.map(contact => `
                <div class="contact-card">
                    <div class="contact-header">
                        <div class="contact-info">
                            <h3>${escapeHtml(contact.name)}</h3>
                            <div class="contact-email">${escapeHtml(contact.email)}</div>
                        </div>
                        <div class="contact-timestamp">${new Date(contact.timestamp).toLocaleString()}</div>
                    </div>
                    <div class="contact-subject">${escapeHtml(contact.subject)}</div>
                    <div class="contact-message">${escapeHtml(contact.message)}</div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Allow Enter key to submit login
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleLogin();
                }
            });
        });
    </script>
</body>
</html>
