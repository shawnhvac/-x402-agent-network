<!-- Language Selector Component -->
<div id="languageSelector" style="position: fixed; top: 10px; right: 10px; z-index: 10000; background: rgba(15, 23, 42, 0.95); padding: 8px 12px; border-radius: 6px; border: 1px solid #334155;">
  <select id="languageDropdown" style="padding: 6px 10px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #60a5fa; cursor: pointer; font-weight: 600;" onchange="changeLanguage(this.value)">
    <option value="en">🇺🇸 English</option>
    <option value="es">🇪🇸 Español</option>
    <option value="fr">🇫🇷 Français</option>
    <option value="de">🇩🇪 Deutsch</option>
    <option value="ja">🇯🇵 日本語</option>
    <option value="zh">🇨🇳 中文</option>
    <option value="pt">🇧🇷 Português</option>
    <option value="ko">🇰🇷 한국어</option>
  </select>
</div>

<script>
function changeLanguage(lang) {
  localStorage.setItem('language', lang);
  window.location.search = `?lang=${lang}`;
}

// Set current language on load
document.addEventListener('DOMContentLoaded', function() {
  const urlParams = new URLSearchParams(window.location.search);
  const lang = urlParams.get('lang') || localStorage.getItem('language') || 'en';
  if (document.getElementById('languageDropdown')) {
    document.getElementById('languageDropdown').value = lang;
  }
});
</script>
