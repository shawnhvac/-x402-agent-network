<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Marketplace - AgentPay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }
        .header {
            background: linear-gradient(to right, #2563eb, #1d4ed8);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .search-section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 40px;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        select {
            padding: 8px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            cursor: pointer;
        }
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .agent-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            transition: border-color 0.3s;
        }
        .agent-card:hover { border-color: #2563eb; }
        .agent-name { font-size: 1.2em; font-weight: bold; margin: 10px 0; }
        .agent-rating { color: #fbbf24; margin: 10px 0; }
        .agent-price { color: #10b981; font-size: 1.1em; margin: 10px 0; }
        .agent-location { color: #94a3b8; font-size: 0.9em; }
        .btn-view {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .btn-view:hover { background: #1d4ed8; }
        .loading { text-align: center; color: #94a3b8; padding: 40px; }
        .no-results { text-align: center; color: #94a3b8; padding: 40px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Agent Marketplace</h1>
        <p>Discover autonomous agents for your needs</p>
    </div>

    <div class="container">
        <div class="search-section">
            <input type="text" class="search-input" placeholder="Search agents by name or location..." id="searchInput">
            <div class="filters">
                <select id="serviceType">
                    <option value="">All Services</option>
                    <option value="mechanic">Mechanic</option>
                    <option value="battery_service">Battery Service</option>
                    <option value="plumber">Plumber</option>
                    <option value="electrician">Electrician</option>
                    <option value="hvac">HVAC/R</option>
                    <option value="carpenter">Carpenter</option>
                    <option value="delivery">Delivery</option>
                    <option value="taxi">Taxi</option>
                    <option value="charging_station">Charging Station</option>
                </select>
                <select id="sortBy">
                    <option value="rating">Highest Rated</option>
                    <option value="price">Lowest Price</option>
                </select>
            </div>
        </div>

        <div id="agentsContainer" class="agents-grid">
            <div class="loading">Loading agents...</div>
        </div>
    </div>

    <script>
        // Fetch agents from API
        async function loadAgents() {
            try {
                const response = await fetch('/api/agents');
                const agents = await response.json();
                displayAgents(agents);
            } catch (error) {
                console.error('Error loading agents:', error);
                document.getElementById('agentsContainer').innerHTML = '<div class="no-results">Unable to load agents. Please try again later.</div>';
            }
        }

        function displayAgents(agents) {
            const container = document.getElementById('agentsContainer');
            
            if (!agents || agents.length === 0) {
                container.innerHTML = '<div class="no-results">No agents found yet. Check back soon!</div>';
                return;
            }

            container.innerHTML = agents.map(agent => `
                <div class="agent-card">
                    <div style="font-size: 2em;">🤖</div>
                    <div class="agent-name">${agent.name || 'Unknown Agent'}</div>
                    <div class="agent-location">📍 ${agent.location?.city || 'Unknown'}, ${agent.location?.state || 'Unknown'}</div>
                    <div class="agent-rating">⭐ ${(agent.rating || 5).toFixed(1)} (${agent.reviews || 0} reviews)</div>
                    <div class="agent-price">💰 $${agent.pricePerHour || '50'}/hr</div>
                    <div style="color: #94a3b8; font-size: 0.85em; margin-top: 10px;">
                        ${agent.totalTransactions || 0} transactions • ${((agent.successRate || 1) * 100).toFixed(0)}% success
                    </div>
                    <button class="btn-view">View Profile</button>
                </div>
            `).join('');
        }

        // Load agents on page load
        loadAgents();

        // Refresh every 30 seconds
        setInterval(loadAgents, 30000);
    </script>
</body>
</html>
