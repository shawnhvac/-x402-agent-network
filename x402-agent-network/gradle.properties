# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# build.gradle files instead.

# When configured, Gradle will run in offline mode and will not attempt to access the network.
# org.gradle.offline=true

# AndroidX package structure to make it easier to support multiple build types
# across different variations of target API level.
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enable the new Kotlin Language Server implementation
# More details: https://youtrack.jetbrains.com/issue/KT-44305
kotlin.lsp.enabled=true

# Gradle daemon configuration (Java 21 compatible)
org.gradle.jvmargs=-Xmx4096m

# Enable parallel gradle tasks
org.gradle.parallel=true

# Enable gradle caching
org.gradle.caching=true

# SDK configuration
android.compileSdkVersion=32
android.targetSdkVersion=32
android.minSdkVersion=26
