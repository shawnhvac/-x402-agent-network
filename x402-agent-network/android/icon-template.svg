<?xml version="1.0" encoding="UTF-8"?>
<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" fill="url(#bgGradient)" rx="45"/>
  
  <!-- Ox head (simplified) -->
  <g transform="translate(96, 75)">
    <!-- Head circle -->
    <circle cx="0" cy="0" r="35" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2"/>
    
    <!-- Left horn -->
    <path d="M -25 -25 Q -35 -40 -30 -55" stroke="#A78BFA" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Right horn -->
    <path d="M 25 -25 Q 35 -40 30 -55" stroke="#A78BFA" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Left eye -->
    <circle cx="-12" cy="-8" r="4" fill="#0F172A"/>
    <circle cx="-12" cy="-8" r="2" fill="#A78BFA"/>
    
    <!-- Right eye -->
    <circle cx="12" cy="-8" r="4" fill="#0F172A"/>
    <circle cx="12" cy="-8" r="2" fill="#A78BFA"/>
    
    <!-- Snout -->
    <ellipse cx="0" cy="10" rx="8" ry="6" fill="#0F172A"/>
    
    <!-- Nostril left -->
    <circle cx="-5" cy="10" r="1.5" fill="#A78BFA"/>
    
    <!-- Nostril right -->
    <circle cx="5" cy="10" r="1.5" fill="#A78BFA"/>
  </g>
  
  <!-- Text below -->
  <text x="96" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    AgentPay™
  </text>
</svg>
