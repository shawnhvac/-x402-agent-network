name: Build & Deploy APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 33
        build-tools-version: '33.0.0'
        ndk-version: '25.1.8937393'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Provider APK Only
      run: |
        cd ${{ github.workspace }}/x402-agent-network
        chmod +x gradlew
        ./gradlew assembleRelease -PagentType=provider --stacktrace

    - name: Sign Provider APK
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd ${{ github.workspace }}/x402-agent-network
        echo "$KEYSTORE_FILE" | base64 -d > release.keystore
        jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore release.keystore \
          -storepass "$KEYSTORE_PASSWORD" \
          -keypass "$KEY_PASSWORD" \
          build/outputs/apk/release/agentpay-provider-release.apk \
          "$KEY_ALIAS"

    - name: Zipalign Provider APK
      run: |
        cd ${{ github.workspace }}/x402-agent-network
        zipalign -v 4 build/outputs/apk/release/agentpay-provider-release.apk \
          build/outputs/apk/release/agentpay-provider-aligned.apk

    - name: Generate version metadata
      run: |
        mkdir -p build-metadata
        echo "{" > build-metadata/build-info.json
        echo "  \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"," >> build-metadata/build-info.json
        echo "  \"commit\": \"${{ github.sha }}\"," >> build-metadata/build-info.json
        echo "  \"branch\": \"${{ github.ref }}\"," >> build-metadata/build-info.json
        echo "  \"build_number\": \"${{ github.run_number }}\"," >> build-metadata/build-info.json
        echo "  \"build\": {" >> build-metadata/build-info.json
        echo "    \"provider\": {" >> build-metadata/build-info.json
        echo "      \"file\": \"agentpay-provider-aligned.apk\"," >> build-metadata/build-info.json
        echo "      \"size\": \"$(stat -c%s x402-agent-network/build/outputs/apk/release/agentpay-provider-aligned.apk 2>/dev/null || echo '0')\"" >> build-metadata/build-info.json
        echo "    }" >> build-metadata/build-info.json
        echo "  }" >> build-metadata/build-info.json
        echo "}" >> build-metadata/build-info.json

    - name: Upload Provider APK to Web Server via SCP
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        
        # Copy Provider APK
        scp -i ~/.ssh/deploy_key \
          x402-agent-network/build/outputs/apk/release/agentpay-provider-aligned.apk \
          "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/agentpay-provider-latest.apk"
        
        # Copy metadata
        scp -i ~/.ssh/deploy_key \
          build-metadata/build-info.json \
          "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/build-info.json"

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Build ${{ github.run_number }}
        body: |
          APK Build ${{ github.run_number }}
          
          **Agent APK**: agentpay-agent-aligned.apk
          **Marketplace APK**: agentpay-marketplace-aligned.apk
          **Provider APK**: agentpay-provider-aligned.apk
          
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          x402-agent-network/build/outputs/apk/release/agentpay-provider-aligned.apk
          build-metadata/build-info.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify Slack
      if: always()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "AgentPay Provider APK Build #${{ github.run_number }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "Build Status: ${{ job.status }}\n\nProvider APK: ✅\n\nCommit: ${{ github.sha }}"
                }
              }
            ]
          }
