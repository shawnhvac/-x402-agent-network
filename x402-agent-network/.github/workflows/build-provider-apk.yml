name: Build AgentPay Provider APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Build Provider APK
        working-directory: x402-agent-network/android
        run: gradle clean assembleDebug -x lint --no-daemon --stacktrace

      - name: Find and upload APK
        run: |
          APK=$(find x402-agent-network/android -name "*.apk" -type f | head -1)
          echo "Found APK: $APK"
          cp "$APK" agentpay-provider.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentpay-provider-apk
          path: agentpay-provider.apk
          retention-days: 30

      - name: Done
        run: echo "SUCCESS: agentpay-provider.apk built"
